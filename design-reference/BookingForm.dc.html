<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg-cream:#FBF7EE; --mint:#E4F3EA; --sky:#E7F2FA; --ink:#2C2A24; --sub:#5B584D;
      --primary:#2F7A68; --primary-dark:#1F5C4E; --accent:#E38B6B; --card:#FFFFFF; --border:#E5DFCE;
    }
    body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg-cream);color:var(--ink);}
    .card{background:#fff;border-radius:20px;border:1px solid var(--border);}
    label{font-size:18px;font-weight:700;display:block;margin-bottom:10px;}
    input,select,textarea{width:100%;box-sizing:border-box;font-family:'Sarabun',sans-serif;font-size:18px;padding:16px 18px;border-radius:14px;border:2px solid var(--border);background:#fff;color:var(--ink);}
    input:focus,select:focus,textarea:focus{outline:3px solid var(--mint);border-color:var(--primary);}
    .opt{display:flex;align-items:center;gap:12px;border:2px solid var(--border);border-radius:16px;padding:16px 18px;font-size:18px;font-weight:600;cursor:pointer;}
    .opt.selected{border-color:var(--primary);background:var(--mint);color:var(--primary-dark);}
    .btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:16px;background:var(--primary);color:#fff;font-size:20px;font-weight:700;border:none;box-shadow:0 4px 0 var(--primary-dark);cursor:pointer;padding:0 32px;}
    .btn-back{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--sub);text-decoration:none;}
  </style>
</helmet>
<div style="width:1440px;min-height:1024px;box-sizing:border-box;display:flex;justify-content:center;padding:48px 24px;">
  <div style="width:760px;display:flex;flex-direction:column;gap:24px;">

    <a href="CustomerDashboard.dc.html" class="btn-back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#5B584D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>กลับหน้าแรก</a>

    <div>
      <div style="font-size:30px;font-weight:800;">ขอผู้ช่วยเดินทาง</div>
      <div style="font-size:17px;color:var(--sub);margin-top:6px;">ขั้นตอนที่ 1 จาก 3 — บอกรายละเอียดธุระของคุณ</div>
    </div>

    <div style="display:flex;gap:8px;">
      <div style="flex:1;height:8px;border-radius:4px;background:var(--primary);"></div>
      <div style="flex:1;height:8px;border-radius:4px;background:var(--border);"></div>
      <div style="flex:1;height:8px;border-radius:4px;background:var(--border);"></div>
    </div>

    <div class="card" style="padding:36px;display:flex;flex-direction:column;gap:28px;">
      <div>
        <label>ประเภทธุระ</label>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;">
          <div class="opt selected">🏥 พาไปหาหมอ</div>
          <div class="opt">🛒 ไปจ่ายตลาด/ซื้อของ</div>
          <div class="opt">🏦 ไปธนาคาร/ราชการ</div>
          <div class="opt">🚗 เดินทางทั่วไป</div>
        </div>
      </div>

      <div>
        <label>วันที่ต้องการ</label>
        <input type="text" value="พรุ่งนี้ (12 ก.ย. 2569)" readonly>
      </div>

      <div>
        <label>เวลาที่ต้องการ</label>
        <input type="text" value="10:00 น." readonly>
      </div>

      <div>
        <label>จุดรับ (ต้นทาง)</label>
        <input type="text" placeholder="เช่น บ้านเลขที่ 12 ซอยลาดพร้าว 15" value="บ้านคุณสมศรี — ซอยลาดพร้าว 15">
      </div>

      <div>
        <label>จุดหมาย (ปลายทาง)</label>
        <input type="text" placeholder="เช่น โรงพยาบาลศิริราช" value="โรงพยาบาลศิริราช อาคาร ผู้ป่วยนอก">
      </div>

      <div>
        <label>รายละเอียดเพิ่มเติม (ถ้ามี)</label>
        <textarea rows="3" placeholder="เช่น ต้องใช้รถเข็น หรือ นัดตรวจ 11 โมง">ต้องการผู้ช่วยพยุงเดิน มีรถเข็นให้ใช้ที่โรงพยาบาล</textarea>
      </div>
    </div>

    <button class="btn-primary" style="align-self:flex-end;">
      ถัดไป: เลือกผู้ช่วยเดินทาง
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div style="position:fixed;right:32px;bottom:32px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;">
  <sc-if value="{{holding}}" hint-placeholder-val="{{false}}">
    <div style="background:#fff;color:#B3261E;font-size:14px;font-weight:700;padding:8px 14px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,0.14);white-space:nowrap;">กดค้างไว้อีก {{holdLabel}} วิ...</div>
  </sc-if>
  <div onMouseDown="{{startHold}}" onMouseUp="{{cancelHold}}" onMouseLeave="{{cancelHold}}" onTouchStart="{{startHold}}" onTouchEnd="{{cancelHold}}" style="width:88px;height:88px;border-radius:50%;background:conic-gradient(#7A1F17 {{holdDeg}}deg, #EFA69B {{holdDeg}}deg); display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 24px rgba(179,38,30,0.38);">
    <div style="width:74px;height:74px;border-radius:50%;background:#E5433A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.6 4.8L18 8l-4.4 1.6L12 14l-1.6-4.4L6 8l4.4-1.2L12 2z" fill="#fff"/><path d="M4 21c1-4 4-7 8-7s7 3 8 7" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span style="color:#fff;font-size:12px;font-weight:800;">ช่วยด่วน</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { holding: false, progress: 0 };
    this.startHold = this.startHold.bind(this);
    this.cancelHold = this.cancelHold.bind(this);
  }
  startHold() {
    if (this._timer) return;
    const started = Date.now();
    this.setState({ holding: true, progress: 0 });
    this._timer = setInterval(() => {
      const pct = Math.min(1, (Date.now() - started) / 1200);
      this.setState({ progress: pct });
      if (pct >= 1) {
        clearInterval(this._timer);
        this._timer = null;
        window.location.href = 'EmergencyConfirm.dc.html';
      }
    }, 40);
  }
  cancelHold() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    this.setState({ holding: false, progress: 0 });
  }
  renderVals() {
    return {
      holding: this.state.holding,
      holdDeg: Math.round(this.state.progress * 360),
      holdLabel: (1.2 - this.state.progress * 1.2).toFixed(1)
    };
  }
}
</script>
</body>
</html>
